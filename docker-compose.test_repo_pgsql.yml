# Used only for repository-level tests with isolated PostgreSQL settings.
#
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.test_repo_pgsql.yml up -d
services:
  postgres:
    container_name: postgres-test
    environment:
      POSTGRES_DB: mlops_test
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data:
