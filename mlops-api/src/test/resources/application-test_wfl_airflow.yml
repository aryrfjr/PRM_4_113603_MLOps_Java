spring:
  airflow:
    base-url: http://localhost:8090  # Maps to airflow-webserver-test in docker

  # Optional: only needed if AirflowService interacts with PostgreSQL directly
  datasource:
    url: jdbc:postgresql://localhost:5440/airflow_test
    username: airflow
    password: airflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

logging:
  level:
    root: INFO
    org.springframework.web.client.RestTemplate: DEBUG
    org.hibernate.SQL: DEBUG
