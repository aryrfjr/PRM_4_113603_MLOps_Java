#
# Minimal MinIO service for testing S3/Object Storage access
# 
# Usage: docker compose -f docker-compose.test_objstr_minio.yml up -d
#

services:
  minio-test:
    image: minio/minio
    container_name: minio-test
    ports:
      - "9002:9000"   # <--- test port, avoid collision with dev/prod (9000)
      - "9003:9001"   # <--- test web console
    environment:
      MINIO_ROOT_USER: testminio
      MINIO_ROOT_PASSWORD: testminio123
    volumes:
      - minio_test_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      retries: 5
    networks:
      - mlopsnet

networks:
  mlopsnet:
    external: true

volumes:
  minio_test_data:

