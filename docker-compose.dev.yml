# Development-only services and dev-specific overrides.
#
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    container_name: postgres
    environment:
      POSTGRES_DB: mlops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  mlops-api:
    build:
      context: ./mlops-api
      args:
        GITHUB_USERNAME: aryrfjr
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mlops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - mlopsnet
    volumes:
      - /home/aryjr/fromiomega/pos-doc/UFSCar/MG-NMR:/data
      - /home/aryjr/.m2/settings.xml:/root/.m2/settings.xml

  mlops-ms-api:
    build: ./mlops-ms-api
    ports:
      - "8000:8000"
    volumes:
      - ./mlops-ms-api:/app
      - /home/aryjr/fromiomega/pos-doc/UFSCar/MG-NMR:/data
    networks:
      - mlopsnet
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mlops-hpc:
    build:
      context: ./hpc-mock
      args:
        GITHUB_USERNAME: aryrfjr
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - minio
    ports:
      - "8082:8080"
    networks:
      - mlopsnet
    volumes:
      - /home/aryjr/fromiomega/pos-doc/UFSCar/MG-NMR:/data
      - /home/aryjr/.m2/settings.xml:/root/.m2/settings.xml

  airflow-webserver:
    image: apache/airflow:2.8.1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      HPC_API_URL: http://mlops-hpc:8080
      MS_API_URL: http://mlops-ms-api:8000
    ports:
      - "8084:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/requirements.txt:/requirements.txt
    command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow webserver"
    networks:
      - mlopsnet

  airflow-scheduler:
    image: apache/airflow:2.8.1
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      HPC_API_URL: http://mlops-hpc:8080
      MS_API_URL: http://mlops-ms-api:8000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/requirements.txt:/requirements.txt
    command: bash -c "pip install --no-cache-dir -r /requirements.txt && airflow scheduler"
    networks:
      - mlopsnet

  airflow-init:
    image: apache/airflow:2.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    entrypoint: bash
    command: -c "
      airflow db migrate && \
      airflow users create \
      --username admin \
      --password admin \
      --firstname Admin \
      --lastname User \
      --role Admin \
      --email admin@example.com"
    networks:
      - mlopsnet
